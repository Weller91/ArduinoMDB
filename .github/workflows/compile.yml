name: Compile Arduino Mega sketch

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:mega
          platforms: |
            - name: arduino:avr
              version: 1.8.8
          libraries: '[]'
          sketch-paths: |
            - .
          enable-warnings-report: true
